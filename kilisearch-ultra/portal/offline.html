<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #16181c;
    color: #e8eaed;
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .card { max-width: 320px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #9aa0a6; margin: 0 0 20px; }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #1a73e8;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>This page needs a connection to search or chat. The static shell loaded from cache, but nothing else will work until you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
